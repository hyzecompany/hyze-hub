name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, hub, sites, consultoria]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
      PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Conferir configuração de produção
        working-directory: .
        run: |
          faltando=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || faltando="$faltando segredo:CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || faltando="$faltando segredo:CLOUDFLARE_ACCOUNT_ID"
          if [ "${{ matrix.app }}" != "api" ] && [ -z "$PUBLIC_TURNSTILE_SITE_KEY" ]; then
            faltando="$faltando variável:PUBLIC_TURNSTILE_SITE_KEY"
          fi
          if [ "${{ matrix.app }}" = "api" ] && grep -q '"database_id": "00000000-' apps/api/wrangler.jsonc; then
            faltando="$faltando database_id-do-D1(rode-pnpm-run-deploy-uma-vez)"
          fi
          if [ -n "$faltando" ]; then
            echo "::error::Configuração faltando no GitHub:$faltando"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Migrações D1
        if: matrix.app == 'api'
        run: pnpm exec wrangler d1 migrations apply hyze-leads --remote
      - name: Build
        if: matrix.app != 'api'
        run: pnpm build
      - name: Publicar na Cloudflare
        run: pnpm run deploy
